name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Ubuntu / Python 3.13
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install frozen dependencies
        run: |
          python -m pip install uv==0.9.14
          uv sync --frozen --extra dev

      - name: Run product gate
        run: |
          mkdir -p .quality/ci
          .venv/bin/pytest -q \
            --strict-markers -rs \
            -m "not slow and not archival_acceptance and not runtime_pinned" \
            --junitxml=.quality/ci/product-junit.xml

      - name: Run focused P15 gate
        if: ${{ !cancelled() }}
        run: |
          mkdir -p .quality/ci
          P15_FOCUSED_TESTS=(
            tests/test_python_graph.py
            tests/test_exact_imported_symbol_bonus.py
            tests/test_dependency_replay.py
            tests/test_p15_post_acceptance_disposition.py
            tests/test_query_planner.py
            tests/test_retrieval_trace.py
            tests/test_retrieval_trace_pipeline.py
          )
          P15_V8_CONTRACT_TEST=tests/test_p15_v8_contract.py
          P15_V8_CONTRACT_HISTORY="$(git log -1 --format=%H HEAD -- "$P15_V8_CONTRACT_TEST")"
          if [[ -n "$P15_V8_CONTRACT_HISTORY" ]]; then
            if [[ ! -f "$P15_V8_CONTRACT_TEST" ]]; then
              echo "P15 v8 contract test existed in history but is missing"
              exit 1
            fi
            P15_FOCUSED_TESTS+=("$P15_V8_CONTRACT_TEST")
          fi
          .venv/bin/pytest -q \
            --strict-markers -rs \
            "${P15_FOCUSED_TESTS[@]}" \
            --junitxml=.quality/ci/p15-focused-junit.xml

      - name: Write runtime identity
        if: ${{ !cancelled() }}
        run: |
          mkdir -p .quality/ci
          .venv/bin/python scripts/write_runtime_identity.py \
            --output .quality/ci/runtime-identity.json

      - name: Upload JUnit reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: junit-${{ github.sha }}
          path: |
            .quality/ci/product-junit.xml
            .quality/ci/p15-focused-junit.xml
          if-no-files-found: error

      - name: Upload runtime identity
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: runtime-identity-${{ github.sha }}
          path: .quality/ci/runtime-identity.json
          if-no-files-found: error
